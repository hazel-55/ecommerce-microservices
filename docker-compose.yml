name: ecommerce-microservices

services:
  postgres-auth:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres-customer:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - customer-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres-order:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD}
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mongo-product:
    image: mongo:8.0
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - product-rs
      - --bind_ip_all
    ports:
      - "127.0.0.1:17017:27017"
    volumes:
      - product-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand({ping:1})
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-shipment:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - shipment-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand({ping:1})
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-product-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongo-product:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongo-product:27017
      - --quiet
      - --eval
    command:
      - |
        try {
          rs.status();
        } catch (error) {
          if (error.code !== 94) {
            throw error;
          }

          const result = rs.initiate({
            _id: "product-rs",
            members: [
              { _id: 0, host: "mongo-product:27017" }
            ]
          });

          if (result.ok !== 1) {
            throw new Error("Product replica set initialization failed");
          }
        }

        const deadline = Date.now() + 30000;

        while (Date.now() < deadline) {
          const hello = db.hello();

          if (
            hello.setName === "product-rs" &&
            hello.isWritablePrimary === true
          ) {
            print("Mongo Product replica set writable primary: OK");
            quit(0);
          }

          sleep(500);
        }

        throw new Error("Product writable primary readiness timed out");

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  auth-data:
  customer-data:
  order-data:
  redis-data:
  product-mongo-data:
  shipment-mongo-data:
  kafka-data:
